<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Echoes of Forever Art | An Infinite Gallery for the Love That Never Leaves</title>
  <meta name="description" content="Echoes of Forever Art is a cinematic emotional art sanctuary for memory, love, loss, eternity, and the hearts that remember." />
  <meta name="theme-color" content="#0B0F1C" />

  <!-- Elegant type pairing. Remove these imports if you need a fully offline file. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /*
      ECHOES OF FOREVER ART — CINEMATIC EXPERIENCE
      --------------------------------------------------
      EDITING GUIDE:
      1. Replace CTA links in CONFIG inside the JavaScript.
      2. Replace artwork image slots in CONFIG.imageSlots.
      3. Edit gate copy in CONFIG.gates.
      4. Adjust palette below in :root.
    */

    :root {
      --black: #0B0F1C;
      --black-2: #0E1324;
      --midnight: #18203A;
      --midnight-2: #121A30;
      --ivory: #FAF8F3;
      --ivory-soft: rgba(250,248,243,0.76);
      --muted: rgba(250,248,243,0.62);
      --gold: #E2B85A;
      --gold-2: #F6E1A0;
      --bronze: #B8862E;
      --crimson: #C9973A;
      --silver: #A0BCE4;
      --line: rgba(250,248,243,0.16);
      --line-gold: rgba(232,196,106,0.38);
      --panel: rgba(11,15,28,0.68);
      --panel-strong: rgba(11,15,28,0.9);
      --shadow: 0 24px 80px rgba(5,8,18,0.45);
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ease: cubic-bezier(.2, .75, .15, 1);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--black);
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ivory);
      font-family: var(--sans);
      background:
        radial-gradient(ellipse at 50% -10%, rgba(250,248,243,0.20), transparent 45%),
        radial-gradient(circle at 82% 18%, rgba(160,188,228,0.16), transparent 35%),
        radial-gradient(circle at 18% 82%, rgba(160,188,228,0.13), transparent 38%),
        linear-gradient(180deg, var(--black), var(--black-2));
    }

    body.locked { overflow: hidden; }

    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; }

    ::selection {
      color: #0E1324;
      background: var(--gold-2);
    }

    .app {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
    }

    /* Background atmosphere */
    #three-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -5;
      opacity: 0.72;
      pointer-events: none;
    }

    .bg-stage {
      position: fixed;
      inset: 0;
      z-index: -8;
      overflow: hidden;
      pointer-events: none;
      background: var(--black);
    }

    .bg-layer {
      position: absolute;
      inset: -8vh -8vw;
      opacity: 0;
      transform: scale(1.07);
      background-position: center;
      background-size: cover;
      filter: saturate(0.95) contrast(1.02) brightness(0.92);
      transition: opacity 1300ms var(--ease), transform 10000ms linear, filter 1300ms var(--ease);
    }

    .bg-layer.active {
      opacity: 1;
      transform: scale(1.16) translate3d(-1.5vw, -1.5vh, 0);
    }

    .veil {
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 40%, transparent 0 30%, rgba(5,8,18,.10) 55%, rgba(5,8,18,.48) 100%),
        linear-gradient(180deg, rgba(11,15,28,.08), rgba(11,15,28,.55));
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 80;
      opacity: 0.035;
      pointer-events: none;
      mix-blend-mode: screen;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
    }

    /* Intro / loading */
    .loader {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 44%, rgba(206,212,224,.12), transparent 34%),
        linear-gradient(180deg, #0B0F1C, #0E1324 52%, #090D19);
      transition: opacity 900ms var(--ease), visibility 900ms var(--ease);
    }

    .loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .portal-card {
      width: min(680px, 94vw);
      padding: clamp(28px, 5vw, 62px);
      text-align: center;
      border: 1px solid var(--line-gold);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(250,248,243,.075), rgba(250,248,243,.026)),
        rgba(11,15,28,.78);
      box-shadow: var(--shadow), inset 0 0 70px rgba(206,212,224,.045);
      backdrop-filter: blur(18px);
      position: relative;
      overflow: hidden;
    }

    .portal-card::before {
      content: "";
      position: absolute;
      inset: -1px;
      background:
        radial-gradient(circle at 50% 0%, rgba(240,238,232,.22), transparent 36%),
        linear-gradient(90deg, transparent, rgba(250,248,243,.15), transparent);
      opacity: .7;
      pointer-events: none;
    }

    .sigil {
      width: 112px;
      height: 112px;
      margin: 0 auto 22px;
      border: 1px solid rgba(240,238,232,.45);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--gold-2);
      box-shadow: 0 0 42px rgba(206,212,224,.13);
      position: relative;
    }

    .sigil::before, .sigil::after {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(160,188,228,.20);
      border-radius: 50%;
    }

    .sigil::after {
      inset: 28px;
      border-color: rgba(160,188,228,0.35);
      transform: rotate(45deg);
      border-radius: 20px;
    }

    .sigil span {
      font-family: var(--serif);
      font-size: 2.9rem;
      line-height: 1;
      z-index: 1;
    }


    /* living sigil: breathes, turns slowly, and sends out echoes */
    .sigil { animation: sigilBreathe 6s ease-in-out infinite; isolation: isolate; }
    @keyframes sigilBreathe {
      0%,100% { transform: scale(1); box-shadow: 0 0 42px rgba(206,212,224,.13); border-color: rgba(240,238,232,.45); }
      50% { transform: scale(1.045); box-shadow: 0 0 70px rgba(206,212,224,.28), 0 0 140px rgba(160,188,228,.12); border-color: rgba(240,238,232,.75); }
    }
    .sigil::before { border-style: dashed; border-color: rgba(160,188,228,.32); animation: sigilTurn 48s linear infinite; }
    .sigil::after { animation: sigilCounter 72s linear infinite; }
    @keyframes sigilTurn { to { transform: rotate(360deg); } }
    @keyframes sigilCounter { from { transform: rotate(45deg); } to { transform: rotate(-315deg); } }
    .sigil .halo { position: absolute; inset: -6px; border-radius: 50%; z-index: -1;
      background: conic-gradient(from 0deg, transparent 0 70%, rgba(250,248,243,.55) 80%, transparent 90%);
      -webkit-mask: radial-gradient(circle, transparent 58%, #000 60%, #000 64%, transparent 66%); mask: radial-gradient(circle, transparent 58%, #000 60%, #000 64%, transparent 66%);
      animation: sigilTurn 9s linear infinite; opacity: .8; }
    .sigil .echo { position: absolute; inset: -1px; border-radius: 50%; border: 1px solid rgba(206,212,224,.5); opacity: 0; pointer-events: none;
      animation: sigilEcho 6s ease-out infinite; }
    .sigil .echo:nth-child(2) { animation-delay: 2s; }
    .sigil .echo:nth-child(3) { animation-delay: 4s; }
    @keyframes sigilEcho { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.6); opacity: 0; } }
    .sigil span { color: transparent; background: linear-gradient(110deg, #CED4E0 20%, #FFFFFF 40%, #A0BCE4 55%, #CED4E0 75%) 0 0 / 250% 100%;
      -webkit-background-clip: text; background-clip: text; animation: sigilShine 6s ease-in-out infinite, infinityTurn 9s cubic-bezier(.45,0,.55,1) infinite; filter: drop-shadow(0 0 10px rgba(206,212,224,.35)); display: inline-block; transform-style: preserve-3d; }
    .sigil { perspective: 320px; }
    @keyframes infinityTurn { 0% { transform: rotateY(0deg); } 50% { transform: rotateY(180deg) scale(1.06); } 100% { transform: rotateY(360deg); } }
    @keyframes sigilShine { 0%,100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
    /* on entering: the sigil blooms outward before the gallery opens */
    .loader.blooming .sigil { animation: sigilBloom 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
    .loader.blooming .sigil .echo { animation: sigilEcho 1.1s ease-out forwards; }
    .loader.blooming .sigil .echo:nth-child(2) { animation-delay: .12s; }
    .loader.blooming .sigil .echo:nth-child(3) { animation-delay: .24s; }
    @keyframes sigilBloom { 40% { transform: scale(1.15); box-shadow: 0 0 120px rgba(240,238,232,.55), 0 0 260px rgba(160,188,228,.3); } 100% { transform: scale(1.35); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .sigil, .sigil::before, .sigil::after, .sigil .halo, .sigil .echo, .sigil span { animation: none !important; }
    }


    /* echo touch: a silver ripple wherever the visitor touches */
    .echo-layer { position: fixed; inset: 0; z-index: 200; pointer-events: none; overflow: hidden; }
    .echo-ring { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
      border: 1px solid rgba(240,238,232,.7); box-shadow: 0 0 12px rgba(206,212,224,.35);
      animation: echoRing 1.6s cubic-bezier(.2,.7,.2,1) forwards; }
    .echo-ring.b { animation-delay: .18s; opacity: 0; border-color: rgba(160,188,228,.55); }
    @keyframes echoRing { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(7); opacity: 0; } }

    /* whispered lines drifting through the dark */
    .whispers { position: fixed; inset: 0; z-index: -2; pointer-events: none; overflow: hidden; }
    .whisper { position: absolute; max-width: min(34ch, 80vw); font-family: var(--serif); font-style: italic;
      font-size: clamp(1.05rem, 1.6vw, 1.4rem); color: rgba(240,238,232,.0); letter-spacing: .02em;
      transition: color 2.4s ease, transform 9s linear, filter 2.4s ease; filter: blur(3px); transform: translateY(6px); }
    .whisper.on { color: rgba(240,238,232,.34); filter: blur(0); transform: translateY(-10px); }

    /* light a candle */
    .candles { margin-top: 26px; display: grid; gap: 14px; }
    .candle-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .candle-form input { flex: 1 1 200px; min-width: 0; padding: 13px 16px; border-radius: 999px; border: 1px solid var(--line, rgba(250,248,243,.16));
      background: rgba(11,15,28,.55); color: var(--pearl, #FAF8F3); font: inherit; }
    .candle-form input:focus { outline: none; border-color: rgba(160,188,228,.6); }
    .candle-sky { position: relative; height: 210px; border-radius: 18px; overflow: hidden; border: 1px solid rgba(250,248,243,.10);
      background: radial-gradient(ellipse at 50% 120%, rgba(160,188,228,.16), transparent 60%), rgba(8,11,22,.55); }
    .candle { position: absolute; width: 14px; height: 46px; margin: -38px 0 0 -7px; cursor: default; }
    .candle .wax { position: absolute; left: 0; bottom: 0; width: 14px; height: 26px; border-radius: 3px 3px 2px 2px / 4px 4px 2px 2px;
      background: linear-gradient(90deg, #b9ad95, #efe6d2 30%, #fffaf0 48%, #e6dbc4 70%, #a99c83);
      box-shadow: inset 0 4px 4px -3px rgba(255,214,150,.9), 0 2px 6px rgba(0,0,0,.45); }
    .candle .wax::before { content: ""; position: absolute; top: -2px; left: 1px; right: 1px; height: 5px; border-radius: 50%;
      background: radial-gradient(ellipse at 50% 40%, #fff6dc, #eadbb8 70%); }
    .candle .wax::after { content: ""; position: absolute; top: 1px; left: 3px; width: 2px; height: 7px; border-radius: 0 0 2px 2px; background: #f7efdc; opacity: .8; }
    .candle .wick { position: absolute; left: 50%; bottom: 25px; width: 1.6px; height: 5px; margin-left: -.8px; border-radius: 1px; background: linear-gradient(#1a120a, #3a2a18); }
    .candle .flame { position: absolute; left: 50%; bottom: 28px; width: 9px; height: 20px; margin-left: -4.5px;
      border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; transform-origin: 50% 92%;
      background:
        radial-gradient(ellipse 40% 22% at 50% 88%, rgba(110,150,255,.7), rgba(110,150,255,0) 100%),
        radial-gradient(ellipse 34% 46% at 50% 66%, #fffef6 0 35%, rgba(255,250,230,0) 100%),
        radial-gradient(ellipse 60% 75% at 50% 62%, #ffe7a3 0 30%, #ffb648 58%, rgba(255,120,30,0) 85%);
      filter: blur(.35px); animation: flicker 1.9s ease-in-out infinite; }
    .candle .halo { position: absolute; left: 50%; bottom: 14px; width: 84px; height: 84px; margin-left: -42px; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(255,196,120,.34), rgba(255,170,90,.12) 38%, rgba(255,170,90,0) 70%);
      animation: haloPulse 2.6s ease-in-out infinite; mix-blend-mode: screen; }
    .candle.mine .halo { background: radial-gradient(circle, rgba(255,206,140,.48), rgba(255,175,95,.16) 40%, rgba(255,170,90,0) 72%); }
    .candle.new { animation: candleIn 1.4s ease forwards; }
    @keyframes candleIn { from { opacity: 0; transform: translateY(8px) scale(.7); } to { opacity: 1; transform: none; } }
    @keyframes flicker {
      0%,100% { transform: scale(1,1) skewX(0deg); opacity: 1; }
      18% { transform: scale(.95,1.06) skewX(2.5deg); }
      34% { transform: scale(1.04,.94) skewX(-2deg); opacity: .94; }
      52% { transform: scale(.97,1.09) skewX(1.5deg); }
      70% { transform: scale(1.02,.96) skewX(-1deg); opacity: .97; }
      86% { transform: scale(.98,1.04) skewX(1deg); }
    }
    @keyframes haloPulse { 0%,100% { opacity: .85; transform: scale(1); } 40% { opacity: 1; transform: scale(1.06); } 70% { opacity: .78; transform: scale(.97); } }
    .candle-tip { position: absolute; z-index: 50; transform: translate(-50%, -330%); white-space: nowrap; padding: 4px 9px; border-radius: 999px;
      background: rgba(11,15,28,.85); border: 1px solid rgba(250,248,243,.16); font-size: .74rem; color: #f0eee8; pointer-events: none; opacity: 0; transition: opacity .3s; }
    .candle-tip.on { opacity: 1; }
    .candle-note { margin: 0; font-size: .82rem; color: var(--muted, rgba(250,248,243,.6)); }
    @media (prefers-reduced-motion: reduce) { .candle .flame, .candle .halo, .echo-ring { animation: none !important; } .whispers { display: none; } }





    /* infinity made of tiny diamonds */
    .sigil .diamond-inf { position: absolute; left: -14px; top: -14px; z-index: 1; width: 140px; height: 140px; filter: drop-shadow(0 0 5px rgba(206,222,255,.4)); }
    .sigil.diamonds { border-color: transparent !important; }
    .sigil.diamonds::before, .sigil.diamonds::after { display: none; }


    /* drama: a gold shimmer ring just outside the circle, and a cloudy gold aura spreading through the card */
    .sigil .goldring { position: absolute; inset: -9px; border-radius: 50%; z-index: -1; pointer-events: none;
      background: conic-gradient(from 0deg, rgba(232,196,106,0) 0deg, rgba(255,236,170,.95) 40deg, rgba(201,151,58,.2) 90deg, rgba(232,196,106,0) 140deg,
                  rgba(255,228,150,.8) 210deg, rgba(232,196,106,0) 270deg, rgba(255,240,190,.9) 320deg, rgba(232,196,106,0) 360deg);
      -webkit-mask: radial-gradient(circle, transparent 60%, #000 62%, #000 70%, transparent 74%); mask: radial-gradient(circle, transparent 60%, #000 62%, #000 70%, transparent 74%);
      filter: blur(.6px) drop-shadow(0 0 8px rgba(255,214,120,.7)); animation: sigilTurn 7s linear infinite; }
    .sigil .aura { position: absolute; left: 50%; top: 50%; width: 640px; height: 640px; margin: -320px; border-radius: 50%; z-index: -2; pointer-events: none;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,222,145,.62) 0 10%, rgba(236,192,100,.36) 19%, rgba(205,155,60,.16) 34%, transparent 56%),
        radial-gradient(ellipse 34% 22% at 30% 42%, rgba(240,200,120,.34), transparent 70%),
        radial-gradient(ellipse 30% 26% at 70% 60%, rgba(255,214,140,.28), transparent 70%),
        radial-gradient(ellipse 26% 34% at 56% 26%, rgba(220,170,80,.24), transparent 70%),
        radial-gradient(ellipse 36% 20% at 40% 74%, rgba(250,210,130,.22), transparent 70%);
      filter: blur(14px); mix-blend-mode: screen; animation: auraDrift 18s ease-in-out infinite, auraBreathe 6s ease-in-out infinite; }
    @keyframes auraDrift { 0% { rotate: 0deg; } 50% { rotate: 180deg; } 100% { rotate: 360deg; } }
    @keyframes auraBreathe { 0%,100% { transform: scale(.92); opacity: .75; } 50% { transform: scale(1.12); opacity: 1; } }
    .sigil .echo { border-color: rgba(240,206,130,.55); }
    .loader.blooming .sigil .aura { animation: auraBloom 1.1s ease-out forwards; }
    @keyframes auraBloom { to { transform: scale(2.4); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .sigil .goldring, .sigil .aura { animation: none !important; } }


    /* Gate 01: an open door with gold light pouring through */
    .memory-stone.has-door { background: #0d0a06 !important; border: 2px solid rgba(232,196,106,.6);
      box-shadow: 0 0 90px rgba(255,200,110,.38), 0 0 200px rgba(255,190,90,.16), inset 0 0 0 6px rgba(40,28,12,.9), inset 0 0 0 7px rgba(232,196,106,.35); }
    .door-way { position: absolute; inset: 8px; border-radius: inherit; overflow: hidden; perspective: 600px;
      background: radial-gradient(ellipse 70% 60% at 50% 66%, #fffaf0 0, #ffe7a8 16%, #f2c262 38%, #b98232 66%, #4d3312 100%); }
    .dw-light { position: absolute; inset: 0; background: radial-gradient(ellipse 55% 45% at 50% 64%, rgba(255,252,235,.95), rgba(255,236,180,.35) 45%, transparent 75%);
      animation: dwGlow 5s ease-in-out infinite; mix-blend-mode: screen; }
    @keyframes dwGlow { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
    .dw-rays { position: absolute; left: -40%; right: -40%; top: -10%; bottom: -10%;
      background: repeating-conic-gradient(from 0deg at 50% 64%, rgba(255,246,214,.38) 0 3deg, transparent 3deg 11deg);
      -webkit-mask: radial-gradient(ellipse at 50% 64%, #000 10%, transparent 62%); mask: radial-gradient(ellipse at 50% 64%, #000 10%, transparent 62%);
      filter: blur(3px); mix-blend-mode: screen; animation: dwRays 30s linear infinite; }
    @keyframes dwRays { to { rotate: 360deg; } }
    .dw-dust { position: absolute; inset: -20% 0; opacity: .8; mix-blend-mode: screen;
      background-image: radial-gradient(circle, rgba(255,248,225,.95) 0 1px, transparent 1.5px), radial-gradient(circle, rgba(255,236,190,.7) 0 .8px, transparent 1.3px);
      background-size: 37px 41px, 23px 29px; background-position: 0 0, 11px 7px; animation: dwDust 14s linear infinite; }
    @keyframes dwDust { to { background-position: 18px -260px, -9px -180px; } }
    .dw-leaf { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 48% 48% 0 0 / 38% 38% 0 0; transform-origin: 0 50%;
      transform: rotateY(-70deg);
      background: linear-gradient(90deg, #2a1a0c, #4a2f17 40%, #3a2412 70%, #1d1208);
      box-shadow: inset -6px 0 14px rgba(255,200,120,.35), inset 0 0 0 2px rgba(120,80,35,.6); }
    .dw-leaf b { position: absolute; left: 14%; right: 14%; border: 1px solid rgba(180,130,60,.45); border-radius: 4px; box-shadow: inset 0 0 8px rgba(0,0,0,.6); }
    .dw-leaf b:nth-child(1) { top: 16%; height: 30%; border-radius: 40% 40% 4px 4px / 30% 30% 4px 4px; }
    .dw-leaf b:nth-child(2) { top: 54%; height: 34%; }
    .dw-leaf em { position: absolute; right: 10%; top: 52%; width: 6px; height: 6px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff1c4, #c9973a 60%, #6b4a18); box-shadow: 0 0 6px rgba(255,214,140,.8); }
    @keyframes dwSway { 0%,100% { transform: rotateY(-72deg); } 50% { transform: rotateY(-66deg); } }
    .dw-spill { position: absolute; left: 50%; top: 58%; width: min(520px, 110%); height: 46%; transform: translateX(-50%); pointer-events: none;
      background: radial-gradient(ellipse 50% 60% at 50% 10%, rgba(255,214,140,.42), rgba(255,190,100,.16) 45%, transparent 75%);
      clip-path: polygon(36% 0, 64% 0, 100% 100%, 0 100%); filter: blur(6px); animation: dwGlow 5s ease-in-out infinite; }
    @media (max-width: 900px) { .memory-stone.has-door { width: min(210px, 56vw); top: 42%; } }
    @media (prefers-reduced-motion: reduce) { .dw-light, .dw-rays, .dw-dust, .dw-leaf, .dw-spill { animation: none !important; } }


    /* living light: drifting caustic shimmer, irregular flicker, rays breathing, twinkling dust */
    .dw-shimmer { position: absolute; inset: -30%; mix-blend-mode: screen; opacity: .55; filter: blur(10px);
      background:
        radial-gradient(ellipse 18% 12% at 30% 40%, rgba(255,250,225,.9), transparent 70%),
        radial-gradient(ellipse 14% 20% at 62% 58%, rgba(255,240,200,.8), transparent 70%),
        radial-gradient(ellipse 22% 10% at 48% 72%, rgba(255,232,180,.7), transparent 70%),
        radial-gradient(ellipse 12% 16% at 70% 30%, rgba(255,246,215,.75), transparent 70%);
      animation: dwCaustic 9s ease-in-out infinite alternate, dwFlicker 3.7s steps(1) infinite; }
    @keyframes dwCaustic { 0% { transform: translate(-6%, 4%) rotate(0deg) scale(1); } 50% { transform: translate(5%, -3%) rotate(14deg) scale(1.12); } 100% { transform: translate(-2%, -6%) rotate(-10deg) scale(.95); } }

      background: rgba(11,15,28,.58);

      padding: 13px 17px;
      outline: none;
      box-shadow: inset 0 0 24px rgba(0,0,0,.22);
    }

      min-height: 108px;
      border-radius: 24px;

    }

    input:focus, textarea:focus {
      border-color: rgba(240,238,232,.48);

    }

      margin-top: 8px;
      color: rgba(250,248,243,.48);
      font-size: .78rem;

    }

    @media (max-width: 900px) {
      .topbar { padding: 15px 14px; }

      .brand-text strong { font-size: 1rem; }
      .gate-rail {
        left: 50%;
        top: auto;
        bottom: 78px;
        transform: translateX(-50%);
        grid-template-columns: repeat(10, 1fr);
        gap: 7px;
        padding: 9px;
        border: 1px solid rgba(250,248,243,.1);
        border-radius: 999px;
        background: rgba(11,15,28,.42);
        backdrop-filter: blur(12px);
      }
      .gate-dot { width: 8px; height: 8px; }
      .gate-dot::after { display: none; }
      .experience { padding: 86px 16px 128px; place-items: start center; }
      .gate {
        grid-template-columns: 1fr;
        gap: 24px;
        padding-left: 0;
      }
      .gate h2 { font-size: clamp(3.4rem, 16vw, 5.6rem); }
      .gate h2.long { font-size: clamp(2.6rem, 11vw, 4rem); }
      .gate .prose { font-size: clamp(1.28rem, 6vw, 1.72rem); }
      .support-line { font-size: .96rem; }
      .visual-panel { min-height: 340px; order: -1; border-radius: 26px; }
      .chapter-hint { bottom: 22px; right: 14px; }
      .chapter-hint span { display: none; }
      .gate-rail { bottom: 74px; }
      .collection-grid { grid-template-columns: 1fr; }
      .email-form { grid-template-columns: 1fr; }
      .gate-actions .cta, .gate-actions .ghost-btn { width: 100%; }
      .portal-card h1 { font-size: clamp(3rem, 16vw, 5.2rem); }
    }

    @media (max-width: 520px) {
      .controls .icon-btn:nth-child(1) { display: none; }
      .visual-panel { min-height: 310px; }
      .panel-label { left: 20px; right: 20px; bottom: 20px; }
      .memory-stone { width: min(250px, 70vw); }
      .orbital-ring { width: 220px; height: 220px; }
      .orbital-ring.r2 { width: 285px; height: 140px; }
      .orbital-ring.r3 { width: 130px; height: 330px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      .bg-layer.active { transform: none; }
    }
  </style>

  <script>
    (() => {
      const cv = document.querySelector('.sigil .diamond-inf'); if (!cv) return;
      const x = cv.getContext('2d'), dpr = Math.min(3, window.devicePixelRatio || 1);
      const W = 140, H = 140, CX = 70, CY = 70; cv.width = W * dpr; cv.height = H * dpr; x.scale(dpr, dpr);
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const rnd = Math.random;
      // the infinity sign
      const INF = [];
      for (let i = 0, N = 420; i < N; i++) {
        const t = (i / N) * Math.PI * 2, den = 1 + Math.sin(t) ** 2;
        const px = Math.cos(t) / den, py = Math.sin(t) * Math.cos(t) / den;
        const t2 = t + 0.01, d2 = 1 + Math.sin(t2) ** 2;
        const nx = -(Math.sin(t2) * Math.cos(t2) / d2 - py), ny = (Math.cos(t2) / d2 - px), nl = Math.hypot(nx, ny) || 1;
        const off = (rnd() - .5) * 0.085;
        INF.push({ x: px + nx / nl * off, y: py + ny / nl * off, z: (rnd() - .5) * 0.25, s: 0.55 + rnd() * 0.95, ph: rnd() * 6.28, sp: 0.8 + rnd() * 2.2, rot: rnd() * 3.14 });
      }
      // rings: outer solid circle, dashed middle circle (turns), inner rounded diamond (turns the other way)
      function ring(r, n, opts) {
        const out = [];
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2;
          if (opts.dash && Math.floor(i / opts.dash) % 2) continue;
          out.push({ a, r: r + (rnd() - .5) * (opts.jit || 1.2), s: opts.s0 + rnd() * opts.s1, ph: rnd() * 6.28, sp: 0.7 + rnd() * 2, rot: rnd() * 3.14 });
        }
        return out;
      }
      const OUTER = ring(55, 300, { s0: .55, s1: .9, jit: 1.6 });
      const DASH = ring(43, 220, { s0: .45, s1: .6, jit: .8 });
      const INNER = [];
      for (let i = 0, n = 150; i < n; i++) {             // rounded square rotated 45°, like the original
        const a = (i / n) * Math.PI * 2, c = Math.cos(a), s2 = Math.sin(a);
        const k = 27 / Math.pow(Math.pow(Math.abs(c), 4) + Math.pow(Math.abs(s2), 4), 0.25);
        INNER.push({ a, r: k + (rnd() - .5) * .8, s: .45 + rnd() * .55, ph: rnd() * 6.28, sp: 0.7 + rnd() * 2, rot: rnd() * 3.14 });
      }
      function diamond(cx, cy, r, a, light, gold) {
        x.save(); x.translate(cx, cy); x.rotate(a);
        const g = x.createLinearGradient(-r, -r, r, r);
        if (gold) { g.addColorStop(0, `rgba(255,248,220,${light})`); g.addColorStop(.5, `rgba(240,${200 + 40 * light|0},${120 + 60 * light|0},${.55 + .45 * light})`); g.addColorStop(1, `rgba(190,140,60,${.5 + .4 * light})`); }
        else { g.addColorStop(0, `rgba(255,255,255,${light})`); g.addColorStop(.5, `rgba(${180 + 60 * light|0},${196 + 50 * light|0},230,${.55 + .45 * light})`); g.addColorStop(1, `rgba(140,160,205,${.5 + .4 * light})`); }
        x.fillStyle = g; x.beginPath(); x.moveTo(0, -r); x.lineTo(r * .7, 0); x.lineTo(0, r); x.lineTo(-r * .7, 0); x.closePath(); x.fill();
        x.restore();
      }
      function glint(cx, cy, r, a) {

        x.moveTo(cx - r, cy); x.lineTo(cx + r, cy); x.moveTo(cx, cy - r); x.lineTo(cx, cy + r); x.stroke(); x.restore();

      function drawRing(list, spin, t, sweep, gold) {
        for (const d of list) {
          const a = d.a + spin, X = CX + Math.cos(a) * d.r, Y = CY + Math.sin(a) * d.r;
          const tw = 0.5 + 0.5 * Math.sin(t * d.sp + d.ph);
          const lit = 0.5 + 0.5 * Math.cos(a - sweep);               // a band of light travels round each ring
          const light = Math.min(1, 0.2 + 0.45 * tw + 0.45 * Math.pow(lit, 6));
          diamond(X, Y, d.s, d.rot + t * .3, light, gold);
          if (light > 0.95) glint(X, Y, d.s * 3, (light - 0.95) * 14);
        }
      }
      function frame(now) {
        const t = now / 1000;
        x.clearRect(0, 0, W, H);
        drawRing(OUTER, reduce ? 0 : t * 0.05, t, t * 1.2, true);
        drawRing(DASH, reduce ? 0 : t * 0.13, t, -t * 0.9, false);
        drawRing(INNER, reduce ? 0 : -t * 0.09, t, t * 1.5, false);
        const ph = t / 4.5, k = Math.floor(ph), f = ph - k, sm = f * f * f * (f * (f * 6 - 15) + 10);
        const turn = reduce ? 0 : Math.PI * (k + sm), c = Math.cos(turn), sn = Math.sin(turn);
        const order = INF.map((d, i) => [d.x * sn + d.z * c, i]).sort((p, q) => p[0] - q[0]);
        for (const [, i] of order) {
          const d = INF[i];

          const facing = 0.5 + 0.5 * Math.cos(turn * 2 + d.ph), tw = 0.5 + 0.5 * Math.sin(t * d.sp + d.ph);

    })();

  <script>
    (() => {
      // The eternal circle: rings of gold and silver diamonds with a light that travels round forever.
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const rnd = Math.random;
      function setup(cv) {
        const x = cv.getContext('2d'); let S = 0, dpr = 1;
        function size() { dpr = Math.min(2.5, window.devicePixelRatio || 1); S = cv.clientWidth; cv.width = S * dpr; cv.height = S * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0); }
        size(); new ResizeObserver(size).observe(cv);
        const ring = (r, n, w, s0, s1, gold) => Array.from({ length: n }, (_, i) => ({ a: i / n * Math.PI * 2 + rnd() * .01, r: r + (rnd() - .5) * w, s: s0 + rnd() * s1, ph: rnd() * 6.28, sp: .7 + rnd() * 2, rot: rnd() * 3.14, gold }));
        const R1 = ring(.40, 520, .035, .7, 1.4, true), R2 = ring(.33, 300, .015, .5, .9, false), R3 = ring(.46, 220, .01, .4, .7, false);
        function diamond(cx, cy, r, a, L, gold) {
          x.save(); x.translate(cx, cy); x.rotate(a);
          const g = x.createLinearGradient(-r, -r, r, r);
          if (gold) { g.addColorStop(0, `rgba(255,248,220,${L})`); g.addColorStop(.5, `rgba(240,${200 + 40 * L | 0},${120 + 60 * L | 0},${.5 + .5 * L})`); g.addColorStop(1, `rgba(190,140,60,${.45 + .45 * L})`); }
          else { g.addColorStop(0, `rgba(255,255,255,${L})`); g.addColorStop(.5, `rgba(${185 + 60 * L | 0},${198 + 50 * L | 0},232,${.5 + .5 * L})`); g.addColorStop(1, `rgba(140,160,205,${.45 + .4 * L})`); }
          x.fillStyle = g; x.beginPath(); x.moveTo(0, -r); x.lineTo(r * .7, 0); x.lineTo(0, r); x.lineTo(-r * .7, 0); x.closePath(); x.fill(); x.restore();
        }
        function draw(list, spin, t, head) {
          const C = S / 2;
          for (const d of list) {
            const a = d.a + spin, X = C + Math.cos(a) * d.r * S, Y = C + Math.sin(a) * d.r * S;
            let gap = ((head - a) % (Math.PI * 2) + Math.PI * 4) % (Math.PI * 2);   // distance behind the travelling light
            const trail = gap < 1.6 ? Math.pow(1 - gap / 1.6, 2) : 0;
            const tw = .5 + .5 * Math.sin(t * d.sp + d.ph);
            const L = Math.min(1, .18 + .4 * tw + .9 * trail);
            diamond(X, Y, d.s * (S / 300) * (1 + trail * .6), d.rot + t * .3, L, d.gold);
            if (L > .95) { x.save(); x.globalAlpha = (L - .95) * 14; x.strokeStyle = '#fff'; x.lineWidth = .6; const r = d.s * 3 * (S / 300);
              x.beginPath(); x.moveTo(X - r, Y); x.lineTo(X + r, Y); x.moveTo(X, Y - r); x.lineTo(X, Y + r); x.stroke(); x.restore(); }
          }
        }
        function frame(now) {
          const t = now / 1000; x.clearRect(0, 0, S, S);
          const head = reduce ? 0 : t * 0.9;
          draw(R3, reduce ? 0 : -t * .04, t, -head * 0.7);
          draw(R2, reduce ? 0 : t * .07, t, head * 1.3 + 2);
          draw(R1, reduce ? 0 : t * .03, t, head);
          // the travelling light itself
          const C = S / 2, hx = C + Math.cos(head + (reduce ? 0 : t * .03)) * .40 * S, hy = C + Math.sin(head + (reduce ? 0 : t * .03)) * .40 * S;
          const g = x.createRadialGradient(hx, hy, 0, hx, hy, S * .06); g.addColorStop(0, 'rgba(255,250,230,.95)'); g.addColorStop(.4, 'rgba(255,220,150,.45)'); g.addColorStop(1, 'rgba(255,200,120,0)');
          x.fillStyle = g; x.beginPath(); x.arc(hx, hy, S * .06, 0, 7); x.fill();
          if (!reduce) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }
      const wait = setInterval(() => { const cv = document.querySelector('.eternal-cv'); if (cv && cv.clientWidth) { clearInterval(wait); setup(cv); } }, 300);
    })();
  </script>
